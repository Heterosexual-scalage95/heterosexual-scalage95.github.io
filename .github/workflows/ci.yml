name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A40E12: ${{ secrets.A40E12 }}
          B9F7A6: ${{ secrets.B9F7A6 }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('A40E12', '')
          env_b = os.environ.get('B9F7A6', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- d3377d8504487b142a8a9d3c74cdc2a64eb55cdcae7534a1 -->', env_a)
          if env_b:
              result = result.replace('<!-- 0b863cc4db764038900253 -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
