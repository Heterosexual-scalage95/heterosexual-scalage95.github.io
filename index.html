<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVEREST ONLINE | CRMP Проект</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 0 20px; width: 100%; }

        /* --- СТИЛИ ДЛЯ ФОТО (ГЛАВНЫЙ БАННЕР) --- */
        .hero-section {
            flex-grow: 1; /* Прижимает футер вниз, если контента мало */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            position: relative;
        }

        .hero-image-wrapper {
            width: 100%;
            max-width: 1200px; /* Ограничиваем ширину на больших экранах */
            margin: 0 auto;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
        }

        .hero-image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            filter: brightness(0.9) contrast(1.1); /* Чуть затемняем, чтобы текст читался лучше */
            transition: transform 0.5s ease;
        }

        .hero-image-wrapper img:hover {
            transform: scale(1.02); /* Легкий зум при наведении */
        }

        .hero-overlay {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            max-width: 600px;
            margin: 0 auto;
            border-top: 2px solid #FF5722;
        }

        .hero-title {
            font-size: 36px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 87, 34, 0.8);
        }

        .hero-subtitle {
            color: #ccc;
            font-size: 18px;
            line-height: 1.5;
        }
        /* ----------------------------------------- */

        /* Кнопки (те же, что и раньше, для единства стиля) */
        .actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 40px;
            width: 100%;
        }

        .btn-flat {
            padding: 14px 24px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #ccc;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .btn-flat:hover {
            border-color: #FF5722;
            color: #FF5722;
            background: #222;
        }

        .btn-download {
            padding: 16px 32px;
            background: linear-gradient(135deg, #FF5722 0%, #FF8F32 100%);
            color: #000;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 20px rgba(255, 87, 34, 0.5);
            border-radius: 50px;
            font-size: 16px;
            border: none;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .btn-download:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 87, 34, 0.8);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #555;
            font-size: 14px;
            margin-top: auto;
            border-top: 1px solid #222;
        }

        @media (max-width: 600px) {
            .hero-title { font-size: 28px; }
            .hero-overlay { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="hero-section">
            
            <!-- Блок с картинкой -->
            <div class="hero-image-wrapper">
                <!-- ВСТАВЛЯЕМ ТВОЮ ССЫЛКУ СЮДА В АТРИБУТ src -->
                <img src="https://unlimbot.hb.ru-msk.vkcloud-storage.ru/image/4/019fb3cf-9544-7723-a46b-64149adf2299-9ba39ac2fad7459f86a22daa66839ecc.jpg" 
                     alt="Атмосфера проекта Everest RP" 
                     loading="lazy">
            </div>

            <!-- Текст поверх картинки (опционально) -->
            <div class="hero-overlay">
                <h1 class="hero-title">Everest RP</h1>
                <p class="hero-subtitle">Погрузись в мир реалистичных ролевых игр. Выбери свою судьбу.</p>
            </div>

            <!-- Кнопки действий -->
            <div class="actions">
                <a href="pravila.html" class="btn-flat">Правила проекта</a>
                <a href="donat.html" class="btn-flat">Донат</a>
                <a href="launcher.apk" class="btn-download" download>Скачать лаунчер</a>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 EVEREST ONLINE. Все права защищены.
    </footer>

</body>
</html>
