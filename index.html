<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVEREST ONLINE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            padding: 40px 20px;
            text-align: center;
        }
        .logo-big {
            font-size: 120px;
            font-weight: 900;
            color: #FF5722;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: -5px;
            filter: drop-shadow(0 0 15px rgba(255, 87, 34, 0.6));
        }
        h1 {
            font-size: 28px;
            color: #ffffff;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
        p.subtitle {
            color: #999;
            margin-top: 10px;
            font-size: 15px;
        }

        /* Контейнер для кнопок */
        .buttons-wrapper {
            width: 100%;
            max-width: 900px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px; /* Отступы между группами кнопок */
        }

        /* Группы кнопок */
        .group {
            display: flex;
            gap: 15px; /* Расстояние между соседними кнопками */
        }
        
        .center-btn-container {
            flex: 1;
            text-align: center;
        }

        /* Стиль обычной кнопки */
        .btn-flat {
            padding: 12px 24px;
            background: transparent;
            border: 1px solid #333;
            color: #ccc;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border-radius: 8px;
            font-size: 14px;
        }
        .btn-flat:hover {
            border-color: #FF5722;
            color: #FF5722;
            box-shadow: 0 0 10px rgba(255, 87, 34, 0.3);
        }

        /* Стиль центральной кнопки (Скачать лаунчер) */
        .btn-main {
            padding: 16px 32px;
            background: #FF5722;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 15px rgba(255, 87, 34, 0.4);
            border-radius: 50px;
            font-size: 16px;
            border: none;
        }
        .btn-main:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 87, 34, 0.8);
        }

        @media (max-width: 600px) {
            .buttons-wrapper {
                flex-direction: column;
                align-items: stretch;
            }
            .group {
                width: 100%;
                justify-content: center;
            }
            .center-btn-container {
                width: 100%;
                margin-top: 15px;
            }
            .logo-big { font-size: 80px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-big">E</div>
        <h1>EVEREST ONLINE</h1>
        <p class="subtitle">Криминальная Россия на твоём телефоне</p>
    </div>

    <div class="buttons-wrapper">
        <!-- Левая группа: Форум, Правила -->
        <div class="group">
            <a href="forum.html" class="btn-flat">Форум</a>
            <a href="pravila.html" class="btn-flat">Правила</a>
        </div>

        <!-- Центр: Скачать лаунчер -->
        <div class="center-btn-container">
            <a href="pravila.html" class="btn-main">Скачать лаунчер</a>
        </div>

        <!-- Правая группа: Донат, Контакты -->
        <div class="group">
            <a href="donat.html" class="btn-flat">Донат</a>
            <a href="contact.html" class="btn-flat">Контакты</a>
        </div>
    </div>
</body>
</html>
