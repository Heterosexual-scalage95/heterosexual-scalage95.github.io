<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Донат | EVEREST ONLINE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Кнопка "Назад" */
        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        .back-link:hover { color: #fff; }

        h1 {
            font-size: 32px;
            color: #FF5722;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 30px;
            text-align: center;
        }

        /* Сетка карточек */
        .donate-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }

        /* Сама карточка */
        .card {
            background: #111;
            padding: 25px; /* Чуть меньше отступов, чем раньше */
            border: 1px solid #333;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }
        .card:hover { 
            border-color: #FF5722; 
            box-shadow: 0 0 15px rgba(255, 87, 34, 0.2);
        }

        .name {
            font-size: 20px;
            color: #fff;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: bold;
        }
        
        .price {
            font-size: 28px;
            color: #FF5722;
            font-weight: bold;
            margin: 15px 0;
            line-height: 1.2;
        }
        
        .desc { 
            color: #aaa; 
            margin-bottom: 25px; 
            line-height: 1.4; 
            font-size: 14px;
            flex-grow: 1; /* Чтобы текст прижимал кнопку вниз */
        }

        /* КНОПКА ВНУТРИ КАРТОЧКИ (теперь аккуратная, как на главной) */
        .btn-flat-card {
            padding: 14px 24px; /* Тот же размер, что и на главной странице */
            background: #1a1a1a;
            border: 1px solid #333;
            color: #ccc;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border-radius: 8px;
            font-size: 14px;
            /* Важно: не растягиваем на 100% ширины карточки, оставляем воздух */
            width: auto; 
            min-width: 160px;
        }
        .btn-flat-card:hover {
            border-color: #FF5722;
            color: #FF5722;
            background: #222;
            box-shadow: 0 0 10px rgba(255, 87, 34, 0.3);
        }

        @media (max-width: 600px) {
            h1 { font-size: 26px; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Назад на главную</a>
        <h1>Донат</h1>

        <div class="donate-grid">
            <!-- Бронза -->
            <div class="card">
                <div>
                    <div class="name">Бронза</div>
                    <div class="price">100 ₽</div>
                    <div class="desc">
                        Уникальный титул, доступ к чату, приоритет в тикетах.
                    </div>
                </div>
                <!-- Ссылка-заглушка, сюда админ вставит свою ссылку оплаты -->
                <a href="#" class="btn-flat-card">Оплатить</a>
            </div>

            <!-- Серебро -->
            <div class="card">
                <div>
                    <div class="name">Серебро</div>
                    <div class="price">300 ₽</div>
                    <div class="desc">
                        Всё из бронзы + VIP-статус, 2x бонус валюты.
                    </div>
                </div>
                <a href="#" class="btn-flat-card">Оплатить</a>
            </div>

            <!-- Золото -->
            <div class="card">
                <div>
                    <div class="name">Золото</div>
                    <div class="price">500 ₽</div>
                    <div class="desc">
                        Всё из серебра + уникальный авто, персональная роль.
                    </div>
                </div>
                <a href="#" class="btn-flat-card">Оплатить</a>
            </div>
        </div>
    </div>
</body>
</html>
