<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Донат | EVEREST ONLINE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { color: #fff; }

        h1 {
            font-size: 32px;
            color: #FF5722;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 30px;
            text-align: center;
        }

        .donate-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px; /* Большие отступы между карточками */
        }

        .card {
            background: #111;
            padding: 30px;
            border: 1px solid #333;
            border-radius: 12px;
            text-align: center;
            transition: border-color 0.3s;
        }
        .card:hover { border-color: #FF5722; }

        .name {
            font-size: 20px;
            color: #fff;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .price {
            font-size: 28px;
            color: #FF5722;
            font-weight: bold;
            margin: 10px 0;
        }
        .desc { 
            color: #aaa; 
            margin-bottom: 25px; 
            line-height: 1.4; 
            font-size: 14px;
        }

        .btn-flat-card {
            padding: 12px 24px;
            background: transparent;
            border: 1px solid #333;
            color: #ccc;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border-radius: 6px;
            font-size: 13px;
        }
        .btn-flat-card:hover {
            border-color: #FF5722;
            color: #FF5722;
            box-shadow: 0 0 10px rgba(255, 87, 34, 0.3);
        }

        @media (max-width: 600px) {
            h1 { font-size: 26px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Назад на главную</a>
        <h1>Донат</h1>

        <div class="donate-grid">
            <!-- Бронза -->
            <div class="card">
                <div class="name">Бронза</div>
                <div class="price">100 ₽</div>
                <div class="desc">
                    Уникальный титул, доступ к чату, приоритет в тикетах.
                </div>
                <a href="#" class="btn-flat-card">Оплатить</a>
            </div>

            <!-- Серебро -->
            <div class="card">
                <div class="name">Серебро</div>
                <div class="price">300 ₽</div>
                <div class="desc">
                    Всё из бронзы + VIP-статус, 2x бонус валюты.
                </div>
                <a href="#" class="btn-flat-card">Оплатить</a>
            </div>

            <!-- Золото -->
            <div class="card">
                <div class="name">Золото</div>
                <div class="price">500 ₽</div>
                <div class="desc">
                    Всё из серебра + уникальный авто, персональная роль.
                </div>
                <a href="#" class="btn-flat-card">Оплатить</a>
            </div>
        </div>
    </div>
</body>
</html>
